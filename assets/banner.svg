  <circle cx="50" cy="188" r="4" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="66" cy="188" r="4" fill="#c084fc" opacity="0.8"/>
  <circle cx="82" cy="188" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="98" cy="188" r="4" fill="#34d399" opacity="0.8"/>
