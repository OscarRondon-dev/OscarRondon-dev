  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>

  <path d="M0 170 Q 112 150, 225 170 T 450 170 T 675 170 T 900 170 L 900 220 L 0 220 Z" fill="url(#accent)" opacity="0.08"/>
  <path d="M0 185 Q 150 165, 300 185 T 600 185 T 900 185" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.35"/>

  <g transform="translate(780, 38)" opacity="0.18">
    <path d="M30 0 C45 15, 45 45, 30 60 C15 45, 15 15, 30 0 Z" fill="url(#accent)"/>
  </g>

  <text x="48" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">
